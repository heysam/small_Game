name: draw-save-game-ci

on:
  push:
    branches: [draw-save-game]
    paths:
      - 'draw-save-game/src/**'
      - 'draw-save-game/package.json'
      - 'draw-save-game/tsconfig.json'
      - 'draw-save-game/index.html'
      - '.github/workflows/draw-save-game-ci.yml'
  pull_request:
    paths:
      - 'draw-save-game/src/**'
      - 'draw-save-game/package.json'
      - 'draw-save-game/tsconfig.json'
      - 'draw-save-game/index.html'
      - '.github/workflows/draw-save-game-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: draw-save-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
