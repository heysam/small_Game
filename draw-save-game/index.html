<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>Draw to Rescue</title>
  </head>
  <body>
    <button id="assist-stroke" type="button" aria-label="輔助畫線：使用目前關卡墨水">輔助畫線</button>
    <aside class="item-dock" aria-label="遊戲道具">
      <button id="item-ink-refill" type="button">墨水補給 ×0</button>
      <button id="item-shield" type="button">護盾 ×0</button>
      <span id="item-status" role="status" aria-live="polite"></span>
    </aside>
    <main id="app" aria-label="Draw to Rescue game"></main>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/assistControl.ts"></script>
    <script type="module" src="/src/itemDock.ts"></script>
  </body>
</html>
